<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 30px; }
        .header { border-bottom: 2px solid #881337; padding-bottom: 12px; margin-bottom: 20px; }
        .title { color: #881337; font-size: 20px; font-weight: 700; }
        .success-box { background-color: #ecfdf5; border: 1px solid #a7f3d0; border-radius: 6px; padding: 15px; margin: 20px 0; color: #065f46; }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">Bharath Masala Products</div>
        </div>
        <h2>Order Delivered!</h2>
        <p>Dear {{ customer_name }},</p>
        <div class="success-box">
            Your order <strong>#{{ order.order_number }}</strong> has been delivered successfully!
        </div>
        <p>We hope you enjoy your spices and authentic traditional blends.</p>
        <div class="footer">
            Thank you for being our valued customer.<br>
            Bharath Masala Products, Thirthahalli.
        </div>
    </div>
</body>
</html>
