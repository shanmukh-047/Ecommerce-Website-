<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8fafc; color: #1e293b; padding: 20px; }
        .card { max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 30px; }
        .header { border-bottom: 2px solid #dc2626; padding-bottom: 12px; margin-bottom: 20px; }
        .title { color: #dc2626; font-size: 20px; font-weight: 700; }
        .notice-box { background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 15px; margin: 20px 0; color: #991b1b; }
        .footer { margin-top: 25px; font-size: 12px; color: #64748b; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="title">Bharath Masala Products</div>
        </div>
        <h2>Return Request Update</h2>
        <p>Dear {{ customer_name }},</p>
        <div class="notice-box">
            Your return request for order <strong>#{{ order_number }}</strong> could not be approved.
        </div>
        <p>If you have any questions or require clarification, please reach out to our customer care team.</p>
        <div class="footer">
            Bharath Masala Products, Thirthahalli.
        </div>
    </div>
</body>
</html>
