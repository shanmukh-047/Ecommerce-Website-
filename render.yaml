# ==============================================================================
# BHARATH MASALA PRODUCTS — RENDER BLUEPRINT (render.yaml)
# Unified production deployment: PostgreSQL, Django REST API, and Next.js SPA
# ==============================================================================
databases:
  - name: bharath-masala-db
    databaseName: bharath_masala
    user: bmp_user
    plan: starter
    postgresMajorVersion: 16

services:
  # ---------------------------------------------------------------------------
  # 1. Django REST Backend Web Service (Python / Gunicorn / WhiteNoise)
  # ---------------------------------------------------------------------------
  - type: web
    name: bharath-masala-api
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bharath-masala-db
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: bharathmasala.com,www.bharathmasala.com,.onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://bharathmasala.com,https://www.bharathmasala.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bharathmasala.com,https://www.bharathmasala.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: ENABLE_RAZORPAY
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DJANGO_LOG_LEVEL
        value: INFO

  # ---------------------------------------------------------------------------
  # 2. Next.js Storefront SPA (Node.js / React 18 / Custom Domain)
  # ---------------------------------------------------------------------------
  - type: web
    name: bharath-masala-frontend
    runtime: node
    plan: starter
    rootDir: frontend
    buildCommand: npm run build
    startCommand: npm run start
    domains:
      - bharathmasala.com
      - www.bharathmasala.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://bharathmasala.com/api
      - key: NEXT_PUBLIC_API_PREFIX
        value: /api/v1
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: bharath-masala-api
          property: host
      - key: NEXT_PUBLIC_SITE_NAME
        value: Bharath Masala
