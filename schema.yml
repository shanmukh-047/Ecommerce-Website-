openapi: 3.0.3
info:
  title: Bharath Masala API
  version: 1.0.0
  description: Production-ready API contract for e-commerce backend
paths:
  /api/v1/auth/addresses/:
    get:
      operationId: auth_addresses_retrieve
      description: List or create saved addresses for the authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: auth_addresses_create
      description: List or create saved addresses for the authenticated user.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/addresses/{id}/:
    get:
      operationId: auth_addresses_retrieve_2
      description: Retrieve, update, or delete a specific address belonging to the
        user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_addresses_partial_update
      description: Retrieve, update, or delete a specific address belonging to the
        user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: auth_addresses_destroy
      description: Retrieve, update, or delete a specific address belonging to the
        user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/addresses/{id}/set-default/:
    post:
      operationId: auth_addresses_set_default_create
      description: Set an address as default shipping or billing.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Authentication endpoint returning Access Token and setting HttpOnly
        Refresh Cookie.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Logout endpoint. Blacklists the submitted refresh token and clears
        the HttpOnly cookie.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Endpoint for retrieving and updating the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: auth_me_partial_update
      description: Endpoint for retrieving and updating the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Retail customer registration endpoint.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/register/wholesale/:
    post:
      operationId: auth_register_wholesale_create
      description: B2B Wholesale customer application endpoint.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Token refresh endpoint. Reads refresh token from HttpOnly cookie (or body fallback),
        rotates the token, blacklists the old one, and returns a new Access Token.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/cart/:
    get:
      operationId: cart_retrieve
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: cart_destroy
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/coupon/:
    post:
      operationId: cart_coupon_create
      description: Applies or removes a promotional coupon code on the active customer/guest
        cart.
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: cart_coupon_destroy
      description: Applies or removes a promotional coupon code on the active customer/guest
        cart.
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/coupon/remove/:
    delete:
      operationId: cart_coupon_remove_destroy
      description: Removes any applied coupon code from the active cart.
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/cart/items/:
    post:
      operationId: cart_items_create
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/cart/items/{id}/:
    patch:
      operationId: cart_items_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    delete:
      operationId: cart_items_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_retrieve
      description: |-
        Public listing of active categories and subcategories
        organized by display sort order.
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/catalog/categories/{slug}/:
    get:
      operationId: catalog_categories_retrieve_2
      description: Public retrieval of category details and its direct children by
        slug.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_retrieve
      description: |-
        Public product catalog listing endpoint.
        Supports filtering by category, tier, form, origin, featured flag, bestseller flag,
        full-text substring search, and price/recency ordering.
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/catalog/products/{slug}/:
    get:
      operationId: catalog_products_retrieve_2
      description: |-
        Public product detail view retrieving complete information by slug.
        Exposes pack-size variants, legal metrology, terroir notes,
        and login-gated wholesale slab pricing for approved B2B buyers.
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/catalog/products/{slug}/reviews/:
    get:
      operationId: catalog_products_reviews_retrieve
      description: |-
        Product reviews endpoint:
        - GET: Public list of approved reviews for the given product slug (paginated).
        - POST: Authenticated review submission (auto-queued for administrative moderation).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
    post:
      operationId: catalog_products_reviews_create
      description: |-
        Product reviews endpoint:
        - GET: Public list of approved reviews for the given product slug (paginated).
        - POST: Authenticated review submission (auto-queued for administrative moderation).
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - catalog
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/inventory/:
    get:
      operationId: inventory_retrieve
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/inventory/{id}/:
    get:
      operationId: inventory_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/inventory/{id}/adjust/:
    post:
      operationId: inventory_adjust_create
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/inventory/restock/:
    post:
      operationId: inventory_restock_create
      tags:
      - inventory
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/:
    get:
      operationId: orders_retrieve
      description: |-
        Lists authenticated customer's historical orders, ordered newest first.
        Strictly isolated to user=request.user to eliminate IDOR.
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/credit-notes/:
    get:
      operationId: orders_credit_notes_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/credit-notes/
        Lists all statutory credit notes issued for the customer's order.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/credit-notes/{id}/download/:
    get:
      operationId: orders_credit_notes_download_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/credit-notes/<uuid:id>/download/
        Downloads the compiled PDF document for a statutory tax credit note.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/invoice/:
    get:
      operationId: orders_invoice_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/invoice/
        Retrieves JSON metadata and tax breakdown for an order's statutory tax invoice.
        Auto-generates invoice if order is in eligible state and invoice not yet created.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/invoice/download/:
    get:
      operationId: orders_invoice_download_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/invoice/download/
        Downloads the compiled PDF file for the order's tax invoice.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/invoice/html/:
    get:
      operationId: orders_invoice_html_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/invoice/html/
        Renders printable HTML view of the statutory GST invoice.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{order_id}/returns/:
    get:
      operationId: orders_returns_list
      description: |-
        GET, POST /api/v1/orders/<order_id>/returns/
        Allows authenticated customers to view and submit return requests for delivered orders.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReturnRequestListList'
          description: ''
    post:
      operationId: orders_returns_create
      description: |-
        GET, POST /api/v1/orders/<order_id>/returns/
        Allows authenticated customers to view and submit return requests for delivered orders.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequestCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReturnRequestCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReturnRequestCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestCreate'
          description: ''
  /api/v1/orders/{order_id}/returns/{id}/:
    get:
      operationId: orders_returns_retrieve
      description: |-
        GET /api/v1/orders/<order_id>/returns/<id>/
        Retrieves full details of a specific return request, including reverse logistics and inspection.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
  /api/v1/orders/{order_id}/returns/{id}/cancel/:
    post:
      operationId: orders_returns_cancel_create
      description: |-
        POST /api/v1/orders/<order_id>/returns/<id>/cancel/
        Allows customer to cancel a return request prior to reverse courier pickup.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnRequestDetail'
          description: ''
  /api/v1/orders/{id}/:
    get:
      operationId: orders_retrieve_2
      description: |-
        Retrieves full details of a customer's specific order.
        Strictly isolated to user=request.user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/{id}/cancel/:
    post:
      operationId: orders_cancel_create
      description: |-
        Allows customers to cancel orders that are in PENDING_PAYMENT status.
        Releases active inventory reservations.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/orders/checkout/:
    post:
      operationId: orders_checkout_create
      description: |-
        Executes atomic checkout from customer's current cart.
        Authoritatively reprices, snapshots address and line items,
        and reserves stock through InventoryService.
      tags:
      - orders
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/payments/orders/{order_id}/:
    get:
      operationId: payments_orders_retrieve
      description: |-
        Customer endpoint retrieving payment status and attempt history for their order.
        Strictly isolated to user=request.user.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/payments/orders/{order_id}/initiate/:
    post:
      operationId: payments_orders_initiate_create
      description: |-
        Customer endpoint to initiate payment for an order in PENDING_PAYMENT status.
        Generates a gateway order and returns client checkout keys and options.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/payments/orders/{order_id}/verify/:
    post:
      operationId: payments_orders_verify_create
      description: |-
        Customer endpoint to verify the HMAC-SHA256 signature returned by the gateway modal.
        Atomically transitions the order to CONFIRMED, consumes stock reservations,
        and marks payment CAPTURED.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - payments
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/payments/webhooks/razorpay/:
    post:
      operationId: payments_webhooks_razorpay_create
      description: |-
        Public ingress point for Razorpay asynchronous server-to-server notifications.
        CSRF-exempt and validated cryptographically using the webhook signature header.
      tags:
      - payments
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/shipping/{shipment_number}/:
    get:
      operationId: shipping_retrieve
      description: |-
        Retrieves full details of a specific consignment belonging to the authenticated customer.
        Enforces strict ownership check (order__user=request.user).
      parameters:
      - in: path
        name: shipment_number
        schema:
          type: string
        required: true
      tags:
      - shipping
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/shipping/orders/{order_id}/tracking/:
    get:
      operationId: shipping_orders_tracking_retrieve
      description: |-
        Retrieves all shipments and tracking milestones for an authenticated customer's order.
        Strictly isolated to user=request.user to eliminate IDOR vulnerabilities.
      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - shipping
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/shipping/track/:
    get:
      operationId: shipping_track_retrieve
      description: |-
        Public milestone tracking endpoint for carrier tracking links (SMS/Email).
        Requires zero authentication, but strictly redacts all customer PII,
        financial data, and item breakdown.
      tags:
      - shipping
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/staff/catalog/reviews/{id}/moderate/:
    post:
      operationId: staff_catalog_reviews_moderate_create
      description: |-
        Staff / Operations Manager review moderation endpoint.
        Allows approving or rejecting customer-submitted product reviews.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/staff/invoices/:
    get:
      operationId: staff_invoices_list
      description: |-
        GET /api/v1/staff/invoices/
        Lists all generated tax invoices with filtering by invoice_number, date range,
        place of supply, and B2B status.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - staff
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoiceList'
          description: ''
  /api/v1/staff/invoices/{id}/:
    get:
      operationId: staff_invoices_retrieve
      description: |-
        GET /api/v1/staff/invoices/<uuid:id>/
        Retrieves full invoice details including statutory tax breakdown and line items.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - staff
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
