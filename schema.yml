          format: date-time
        valid_to:
          type: string
          format: date-time
        is_active:
          type: boolean
        applicable_to_wholesale:
          type: boolean
          description: Whether this promotion applies to wholesale/B2B tier customers.
        stackable_with_coupons:
          type: boolean
          description: Whether customer coupons can be combined on top of this automatic
            promotion.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PromotionRule'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - discount_type
      - discount_value
      - id
      - name
      - promo_type
      - updated_at
      - valid_from
      - valid_to
    StaffPromotionRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
        promo_type:
          $ref: '#/components/schemas/PromoTypeEnum'
        discount_type:
          $ref: '#/components/schemas/DiscountTypeEnum'
        discount_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        max_discount_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        priority:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: 'Evaluation precedence: lower values evaluate first.'
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
        is_active:
          type: boolean
        applicable_to_wholesale:
          type: boolean
          description: Whether this promotion applies to wholesale/B2B tier customers.
        stackable_with_coupons:
          type: boolean
          description: Whether customer coupons can be combined on top of this automatic
            promotion.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PromotionRuleRequest'
      required:
      - discount_type
      - discount_value
      - name
      - promo_type
      - valid_from
      - valid_to
    StaffReturnComplete:
      type: object
      properties:
        resolution:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ResolutionEnum'
          - $ref: '#/components/schemas/NullEnum'
    StaffReturnCompleteRequest:
      type: object
      properties:
        resolution:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ResolutionEnum'
          - $ref: '#/components/schemas/NullEnum'
    StaffReturnInspection:
      type: object
      properties:
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          default: PASSED
        disposition:
          allOf:
          - $ref: '#/components/schemas/DispositionEnum'
          default: RESTOCK
        quantity_passed:
          type: integer
          minimum: 0
          default: 0
        quantity_failed:
          type: integer
          minimum: 0
          default: 0
        notes:
          type: string
          default: ''
    StaffReturnInspectionRequest:
      type: object
      properties:
        result:
          allOf:
          - $ref: '#/components/schemas/ResultEnum'
          default: PASSED
        disposition:
          allOf:
          - $ref: '#/components/schemas/DispositionEnum'
          default: RESTOCK
        quantity_passed:
          type: integer
          minimum: 0
          default: 0
        quantity_failed:
          type: integer
          minimum: 0
          default: 0
        notes:
          type: string
          default: ''
    StaffReturnReview:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        approved_resolution:
          allOf:
          - $ref: '#/components/schemas/ResolutionEnum'
          default: REFUND
        rejection_reason:
          type: string
          default: ''
        review_notes:
          type: string
          default: ''
      required:
      - action
    StaffReturnReviewRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        approved_resolution:
          allOf:
          - $ref: '#/components/schemas/ResolutionEnum'
          default: REFUND
        rejection_reason:
          type: string
          default: ''
        review_notes:
          type: string
          default: ''
      required:
      - action
    StaffReversePickupSchedule:
      type: object
      properties:
        courier_name:
          allOf:
          - $ref: '#/components/schemas/CourierNameEnum'
          default: MANUAL
        scheduled_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          default: ''
    StaffReversePickupScheduleRequest:
      type: object
      properties:
        courier_name:
          allOf:
          - $ref: '#/components/schemas/CourierNameEnum'
          default: MANUAL
        scheduled_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          default: ''
    StaffReverseShipmentStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusCe3Enum'
        notes:
          type: string
          default: ''
      required:
      - status
    StaffReverseShipmentStatusRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusCe3Enum'
        notes:
          type: string
          default: ''
      required:
      - status
    Status3c6Enum:
      enum:
      - PENDING_REVIEW
      - APPROVED
      - REJECTED
      - PICKUP_SCHEDULED
      - IN_TRANSIT
      - RECEIVED
      - INSPECTED
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `PENDING_REVIEW` - Pending Staff Review
        * `APPROVED` - Approved for Pickup
        * `REJECTED` - Rejected
        * `PICKUP_SCHEDULED` - Reverse Pickup Scheduled
        * `IN_TRANSIT` - In Transit to Warehouse
        * `RECEIVED` - Received at Warehouse
        * `INSPECTED` - Inspection Completed
        * `COMPLETED` - Completed (Resolved)
        * `CANCELLED` - Cancelled by Customer
    StatusCe3Enum:
      enum:
      - SCHEDULED
      - OUT_FOR_PICKUP
      - PICKED_UP
      - IN_TRANSIT
      - DELIVERED
      - FAILED_PICKUP
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - Pickup Scheduled
        * `OUT_FOR_PICKUP` - Out for Pickup
        * `PICKED_UP` - Picked Up
        * `IN_TRANSIT` - In Transit to Warehouse
        * `DELIVERED` - Delivered to Warehouse
        * `FAILED_PICKUP` - Failed Pickup
        * `CANCELLED` - Cancelled
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
tags:
- name: Core
